# Keeps the commit-pinned actions in .github/workflows current. A new release waits a week before it is proposed,
# so one that turns out to be bad is usually pulled first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
